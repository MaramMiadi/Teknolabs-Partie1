---
- name: Create the application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0755"

- name: Clone / update the repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version }}"
    force: true
  become: true
  become_user: "{{ deploy_user }}"
  register: app_git
  notify: restart app

- name: Check whether a previous build exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/.next/BUILD_ID"
  register: app_build

- name: Install dependencies (npm ci)
  ansible.builtin.command: npm ci
  args:
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  when: app_git.changed or not app_build.stat.exists

- name: Build the application (npm run build)
  ansible.builtin.command: npm run build
  args:
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  when: app_git.changed or not app_build.stat.exists

- name: Check whether PM2 already manages the app
  ansible.builtin.command: pm2 describe {{ app_name }}
  become: true
  become_user: "{{ deploy_user }}"
  register: pm2_status
  changed_when: false
  failed_when: false

- name: Start the application with PM2
  ansible.builtin.command: >
    pm2 start npm --name {{ app_name }} -- start -- -p {{ app_port }}
  args:
    chdir: "{{ app_dir }}"
  become: true
  become_user: "{{ deploy_user }}"
  when: pm2_status.rc != 0