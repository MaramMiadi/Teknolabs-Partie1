---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Deploy the portfolio vhost
  ansible.builtin.template:
    src: portfolio.conf.j2
    dest: /etc/nginx/sites-available/portfolio.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Enable the portfolio site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/portfolio.conf
    dest: /etc/nginx/sites-enabled/portfolio.conf
    state: link
  notify: reload nginx

- name: Remove the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Ensure nginx is started and enabled at boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true